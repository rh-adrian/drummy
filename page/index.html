<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Drummer</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      background: #14141c; color: #e8e8f0;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
    }
    header { padding: 1rem 1.5rem; border-bottom: 1px solid #2a2a3a; display: flex; align-items: baseline; gap: 1rem; }
    h1 { font-size: 1.1rem; margin: 0; letter-spacing: 0.05em; }
    #status { font-size: 0.8rem; color: #9aa; display: flex; gap: 1.2rem; }
    .dot { display: inline-block; width: 0.6em; height: 0.6em; border-radius: 50%; background: #555; margin-right: 0.4em; }
    .dot.on { background: #4ade80; }
    .dot.warn { background: #fbbf24; }
    main { flex: 1; padding: 1.5rem; }
    #transport { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
    #playpause {
      font: inherit; font-size: 1rem; width: 3.2rem; padding: 0.45rem 0; cursor: pointer;
      background: #1c1c28; color: #4ade80; border: 1px solid #2a2a3a; border-radius: 8px;
    }
    #playpause:disabled { color: #555; cursor: default; }
    #meta { font-size: 1.6rem; }
    #meta .bank { color: #7dd3fc; }
    #grid {
      background: #0c0c12; border: 1px solid #2a2a3a; border-radius: 8px;
      padding: 1rem; overflow-x: auto; color: #667;
      display: grid; gap: 3px; align-content: start; min-height: 6rem;
      font-size: 0.75rem;
    }
    .grid-row { display: grid; grid-template-columns: 2.6em repeat(var(--steps), minmax(13px, 1.6em)); gap: 3px; align-items: stretch; }
    .grid-label { color: #9aa; align-self: center; text-transform: uppercase; }
    .grid-cell { aspect-ratio: 1; border-radius: 3px; background: #1a1a26; }
    .grid-cell.beat { box-shadow: inset 2px 0 0 #262636; }
    .grid-cell.barline { box-shadow: inset 2px 0 0 #3a3a52; }
    .grid-cell.hit { background: #4ade80; opacity: var(--vel, 1); }
    .grid-cell.ph { outline: 1px solid #7dd3fc; }
    .grid-cell.hit.ph { background: #a7f3d0; }
    #codebox { margin-top: 1rem; }
    #codebox summary { cursor: pointer; color: #9aa; font-size: 0.8rem; }
    #code {
      background: #0c0c12; border: 1px solid #2a2a3a; border-radius: 8px;
      padding: 1rem; font-size: 0.8rem; white-space: pre; overflow-x: auto;
      color: #a5b4fc; margin-top: 0.5rem;
    }
    #overlay {
      position: fixed; inset: 0; background: rgba(10, 10, 16, 0.92);
      display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1rem;
    }
    #overlay.hidden { display: none; }
    #arm {
      font: inherit; font-size: 1.4rem; padding: 1rem 3rem; cursor: pointer;
      background: #4ade80; color: #0c0c12; border: none; border-radius: 10px;
    }
    #overlay p { color: #9aa; font-size: 0.85rem; }
  </style>
</head>
<body>
  <header>
    <h1>AI DRUMMER</h1>
    <div id="status">
      <span><span class="dot" id="dot-server"></span>server</span>
      <span><span class="dot" id="dot-audio"></span>audio</span>
      <span><span class="dot" id="dot-playing"></span>playing</span>
    </div>
  </header>
  <main>
    <div id="transport">
      <button id="playpause" disabled title="play/pause">▶</button>
      <div id="meta">—</div>
    </div>
    <div id="grid">// waiting for a groove…</div>
    <details id="codebox">
      <summary>show code</summary>
      <pre id="code">// waiting for a groove…</pre>
    </details>
  </main>
  <div id="overlay">
    <button id="arm">▶ Start</button>
    <p>One click arms the browser's audio — then your AI drummer takes it from here.</p>
  </div>
  <script src="https://unpkg.com/@strudel/web@1.3.0"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
