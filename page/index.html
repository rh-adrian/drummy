<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Drummer</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      background: #14141c; color: #e8e8f0;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
    }
    header { padding: 1rem 1.5rem; border-bottom: 1px solid #2a2a3a; display: flex; align-items: baseline; gap: 1rem; }
    h1 { font-size: 1.1rem; margin: 0; letter-spacing: 0.05em; }
    #status { font-size: 0.8rem; color: #9aa; display: flex; gap: 1.2rem; }
    .dot { display: inline-block; width: 0.6em; height: 0.6em; border-radius: 50%; background: #555; margin-right: 0.4em; }
    .dot.on { background: #4ade80; }
    .dot.warn { background: #fbbf24; }
    main { flex: 1; padding: 1.5rem; }
    #transport { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
    #playpause {
      font: inherit; font-size: 1rem; width: 3.2rem; padding: 0.45rem 0; cursor: pointer;
      background: #1c1c28; color: #4ade80; border: 1px solid #2a2a3a; border-radius: 8px;
    }
    #playpause:disabled { color: #555; cursor: default; }
    #meta { font-size: 1.6rem; }
    #bpmctl { margin-left: auto; display: flex; align-items: center; gap: 0.4rem; color: #9aa; font-size: 0.9rem; }
    #bpmctl input { width: 4.5rem; background: #14141c; color: #dde; border: 1px solid #2a2a3a; border-radius: 4px; padding: 0.25rem 0.4rem; font: inherit; }
    #undo { background: #14141c; color: #9aa; border: 1px solid #2a2a3a; border-radius: 4px; padding: 0.25rem 0.6rem; cursor: pointer; font-size: 1rem; }
    #undo:hover { color: #dde; border-color: #4ade80; }
    #zoomctl { display: flex; align-items: center; gap: 0.4rem; color: #9aa; }
    #zoomctl input { width: 9rem; accent-color: #7dd3fc; cursor: pointer; }
    .grid-head { display: flex; align-items: center; gap: 3px; min-width: 0; }
    .grid-head .grid-name { flex: 1; }
    .row-btn { background: #14141c; color: #667; border: 1px solid #2a2a3a; border-radius: 3px; font-size: 0.65em; line-height: 1; padding: 2px 4px; cursor: pointer; flex: none; }
    .row-btn:hover { color: #dde; border-color: #4ade80; }
    .mute-btn.active { background: #7c2d3e; color: #fecdd3; border-color: #be5060; }
    .grid-row.muted .grid-cell { opacity: 0.3; }
    .grid-row.muted .grid-name { color: #556; text-decoration: line-through; }
    #meta .bank { color: #7dd3fc; }
    #grid {
      background: #0c0c12; border: 1px solid #2a2a3a; border-radius: 8px;
      padding: 1rem; overflow-x: auto; color: #667;
      display: grid; gap: 3px; align-content: start; min-height: 6rem;
      /* --zoom (v1.5 FR-7): everything in the grid is em-based, so scaling the
         base font scales cells, labels, header, and faders together. */
      --zoom: 1;
      font-size: calc(0.75rem * var(--zoom));
    }
    .grid-row { display: grid; grid-template-columns: 8.5em repeat(var(--steps), minmax(calc(13px * var(--zoom, 1)), 1.6em)); gap: 3px; align-items: stretch; }
    .grid-label { display: flex; flex-direction: column; justify-content: center; gap: 2px; padding-right: 6px; }
    .grid-name { color: #9aa; text-transform: uppercase; font-size: 0.8em; letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-vol { width: 100%; height: 8px; margin: 0; accent-color: #4ade80; cursor: pointer; }
    .bar-row .bar-title { color: #7dd3fc; font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.08em; padding: 2px 0 0 2px; border-left: 2px solid #3a3a52; }
    .count-row { margin-bottom: 1px; }
    .count-cell { color: #556; font-size: 0.7em; text-align: center; align-self: end; user-select: none; }
    .count-cell.count-beat { color: #9aa; font-weight: 700; }
    .grid-cell { aspect-ratio: 1; border-radius: 3px; background: #1a1a26; cursor: pointer; }
    .grid-cell:hover { outline: 1px solid #4ade80; }
    .beat { box-shadow: inset 3px 0 0 #2e2e42; }
    .barline { box-shadow: inset 4px 0 0 #4a4a68; }
    .grid-cell.hit { background: #4ade80; opacity: var(--vel, 1); }
    .grid-cell.ph { outline: 1px solid #7dd3fc; }
    .grid-cell.hit.ph { background: #a7f3d0; }
    #codebox { margin-top: 1rem; }
    #codebox summary { cursor: pointer; color: #9aa; font-size: 0.8rem; }
    #code {
      background: #0c0c12; border: 1px solid #2a2a3a; border-radius: 8px;
      padding: 1rem; font-size: 0.8rem; white-space: pre; overflow-x: auto;
      color: #a5b4fc; margin-top: 0.5rem;
    }
    #overlay {
      position: fixed; inset: 0; background: rgba(10, 10, 16, 0.92);
      display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1rem;
    }
    #overlay.hidden { display: none; }
    #arm {
      font: inherit; font-size: 1.4rem; padding: 1rem 3rem; cursor: pointer;
      background: #4ade80; color: #0c0c12; border: none; border-radius: 10px;
    }
    #overlay p { color: #9aa; font-size: 0.85rem; }
  </style>
</head>
<body>
  <header>
    <h1>AI DRUMMER</h1>
    <div id="status">
      <span><span class="dot" id="dot-server"></span>server</span>
      <span><span class="dot" id="dot-audio"></span>audio</span>
      <span><span class="dot" id="dot-playing"></span>playing</span>
    </div>
  </header>
  <main>
    <div id="transport">
      <button id="playpause" disabled title="play/pause">▶</button>
      <div id="meta">—</div>
      <label id="bpmctl" title="tempo">BPM <input id="bpm" type="number" min="40" max="300" step="1" /></label>
      <button id="undo" title="undo your last page edit">↩</button>
      <label id="zoomctl" title="grid size">🔍 <input id="zoom" type="range" min="70" max="220" value="100" /></label>
    </div>
    <div id="grid">// waiting for a groove…</div>
    <details id="codebox">
      <summary>show code</summary>
      <pre id="code">// waiting for a groove…</pre>
    </details>
  </main>
  <div id="overlay">
    <button id="arm">▶ Start</button>
    <p>One click arms the browser's audio — then your AI drummer takes it from here.</p>
  </div>
  <script src="https://unpkg.com/@strudel/web@1.3.0"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
